name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Game-logic unit tests
        run: swift test --package-path RimwardCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the iOS app for the simulator
        run: make build
